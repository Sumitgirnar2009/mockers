<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Practice MHT CET with full-length online mock tests, chapter-wise MCQs, detailed solutions, and real exam interface on CrackCET."
    />
    <meta
      name="description"
      content="Free CET exam preparation with mock tests, practice questions, and study materials for Maharashtra CET exams."
    />
    <meta
      name="keywords"
      content="CET exam, Maharashtra CET, CET preparation, engineering entrance, medical entrance, mock tests"
    />
    <meta name="author" content="CrackCET" />

    <!-- Important for SEO -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph tags for social media -->
    <meta
      property="og:title"
      content="CrackCET - Best CET Preparation Platform"
    />
    <meta
      property="og:description"
      content="Free CET exam preparation resources"
    />
    <meta property="og:image" content="https://crackcet.in/assets/logo.png" />
    <meta property="og:url" content="https://crackcet.in/" />

    <!-- Google verification tag (from Step 1) -->
    <meta name="google-site-verification" content="YOUR_CODE_HERE" />

    <title>MHT CET Online Mock Tests & MCQs | CrackCET</title>

    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Add this to index.html inside <head> -->
    <meta name="google-site-verification" content="YOUR_CODE_HERE" />

    <!-- ✅ Favicon (Google Search compatible) -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/favicon.png" />

    <!-- Optional: Browser UI color -->
    <meta name="theme-color" content="#0d6efd" />

    <!-- KaTeX CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />

    <!-- KaTeX JS -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
      onload="renderMathInElement(document.body);"
    ></script>

    <!-- Tell Google to index JavaScript content -->
    <meta
      name="googlebot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta
      name="bingbot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!-- Prerender for SEO (optional but helpful) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CrackCET",
        "url": "https://crackcet.in/",
        "description": "Free CET exam preparation platform"
      }
    </script>
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
