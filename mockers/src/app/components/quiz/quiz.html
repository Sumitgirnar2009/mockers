<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Professional Test UI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      /* Global Styling */
      body {
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background-color: #f8f9fa;
        color: #333;
      }

      .navbar-custom {
        background: #004085;
        color: #fff;
      }

      .navbar-custom .navbar-brand,
      .navbar-custom .nav-link,
      .navbar-custom .dropdown-toggle {
        color: #fff !important;
      }

      /* Make the navbar feel like a modern dashboard */
      .navbar-brand {
        font-size: 1.25rem;
        letter-spacing: 0.5px;
      }

      .timer-box {
        font-size: 0.9rem;
      }

      .dropdown-menu {
        border-radius: 0.75rem;
      }

      .timer-box {
        background: #fff;
        border: 2px solid #dc3545;
        border-radius: 8px;
        padding: 8px 15px;
        font-size: 1.2rem;
        font-weight: bold;
        color: #dc3545;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      .card-custom {
        background: #fff;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        margin-bottom: 15px;
      }

      button.btn-danger {
        font-size: 1rem;
        font-weight: 600;
        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <!-- Navbar with User Info -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm p-2">
      <div class="container-fluid">
        <!-- Brand -->
        <a class="navbar-brand fw-bold text-primary" href="#">
          <i class="bi bi-journal-text me-2"></i> Test Portal {{ attemptId() }}
        </a>

        <!-- Timer (always visible) -->
        <div class="order-lg-2 mx-auto">
          <div
            class="timer-box px-3 py-1 bg-light rounded-pill border small fw-semibold text-dark"
          >
            <!-- Pass the entire attemptModel, child will extract startTime -->
            <!-- Use attemptModel directly -->
            <app-timer [startTime]="startTime"> </app-timer>
          </div>
        </div>

        <!-- Toggler for mobile -->
        <button
          class="navbar-toggler ms-auto"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Right side -->
        <div class="collapse navbar-collapse order-lg-3" id="navbarContent">
          <div
            class="d-flex align-items-center ms-lg-auto flex-column flex-lg-row gap-3 mt-3 mt-lg-0"
          >
            <!-- Direct links -->
            <a class="nav-link text-dark fw-semibold" href="#">
              <i class="bi bi-person"></i> {{ username ? username : "Guest" }}
              <!-- <i class="bi bi-person"></i>  'Guest'  -->
            </a>
            <a class="nav-link text-dark fw-semibold" href="#">
              <i class="bi bi-gear"></i> Settings
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Page Content -->
    <div class="container-fluid p-3">
      <!-- Section Tabs -->
      <div class="card-custom">
        <app-section-tabs
          (currentSection)="handleCurrentSection($event)"
          [attemptId]="attemptId()"
          [attemptModel]="attemptModel()"
          [quizId]="quizId"
        ></app-section-tabs>
      </div>

      <!-- Main Content -->
      <div class="row mt-3">
        <!-- Question Panel -->
        <div class="col-12 col-lg-8">
          <div class="card-custom">
            <app-questions
              [currentQuestionModel]="currentQuestionModel"
              [currentQuestionData]="currentQuestionData"
              [attemptId]="attemptId()"
              (saveStatusAndNext)="handleNextQuestion($event)"
              (saveStatusAndPrev)="handlePreviousQuestion($event)"
            >
            </app-questions>
          </div>
        </div>

        <!-- Right Sidebar -->
        <div class="col-12 col-lg-4">
          <div class="card-custom">
            <app-legend
              [currentSection]="currentSection"
              class="w-100 mb-3"
            ></app-legend>
            <app-navigator
              (navigateQuestion)="handleNavigateQuestion($event)"
              [currentSection]="currentSection"
              class="w-100 mb-3"
            >
            </app-navigator>
            <button
              class="btn btn-danger w-100 mt-4 shadow-sm fw-bold rounded-pill"
              (click)="submitTest()"
            >
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
