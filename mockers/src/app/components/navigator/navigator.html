<div class="section-header mb-3">
  <div class="current-section text-white text-center py-2 px-3 rounded">
    {{ currentSection }}
  </div>
  <h4 class="mt-3 text-secondary text-center">Choose a Question</h4>
</div>

<div class="d-flex flex-wrap gap-2 justify-content-center">
  @for (item of getSectionNumbers(); track item; let i = $index) {
    <div class="box"
         [ngClass]="getStatus(item)"
         (click)="navigateTo(item)">
      {{ i + 1 }}
    </div>
  }
</div>
