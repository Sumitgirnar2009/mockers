<section class="mock-test-section">
  <div class="container">
    <h2 class="section-title">Mock Tests</h2>

    <div class="mock-test-list">
      <!-- Dynamic quiz cards -->
      <div
        class="mock-test-item"
        *ngFor="let quiz of quizRecords; let i = index"
        [ngClass]="quiz.quizType"
      >
        <h3><b>{{ quiz.quizName }}</b></h3>

        <p>
          {{
            quiz.quizType === 'free'
              ? 'Try this free mock test to start your preparation!'
              : 'This is a paid test. Subscribe to start.'
          }}
        </p>

        <!-- Continue or Start button -->
        <button
          *ngIf="quiz.isProgress; else startButton"
          class="continue-btn"
          (click)="onQuizAction(quiz)"
        >
          Continue Test — Attempt
          <span class="highlight">{{ quiz.attemptNo }}</span>
        </button>

        <ng-template #startButton>
          <button
            class="start-btn"
            (click)="onQuizAction(quiz)"
            [title]="
              quiz.quizType !== 'free'
                ? 'Subscribe to access'
                : 'Click to start the test'
            "
          >
            Start Test — Attempt
            <span class="highlight">{{ quiz.attemptNo }}</span>
          </button>
        </ng-template>

        <button
          class="view-btn"
          [routerLink]="['/attempts-analysis', quiz.quizId]"
        >
          View Previous Attempts
        </button>
      </div>

      <!-- Locked Tests -->
      <div class="mock-test-item locked">
        <h3>Mock Test 2</h3>
        <p>Unlock to access this test.</p>
        <button class="unlock-btn">
          <i class="fas fa-lock"></i> Unlock
        </button>
      </div>

      <div class="mock-test-item locked">
        <h3>Mock Test 3</h3>
        <p>Unlock to access this test.</p>
        <button class="unlock-btn">
          <i class="fas fa-lock"></i> Unlock
        </button>
      </div>

      <!-- More Tests -->
      <div class="mock-test-item more-tests">
        <div class="more-tests-container">
          <button class="more-btn">
            <span class="more-btn-text">See More Tests</span>
            <i class="fas fa-chevron-down more-btn-icon"></i>
          </button>
          <p class="more-tests-description">
            Explore our complete test library
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
