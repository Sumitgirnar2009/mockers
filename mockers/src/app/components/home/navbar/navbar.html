<header>
  <nav class="navbar navbar-expand-lg fixed-top navbar-custom">
    <div class="container-fluid">
      <!-- Logo + Brand -->
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img
          src="assets/web-images/web_logo.png"
          alt="MHT CET Logo"
          class="navbar-logo"
        />
      </a>

      <!-- Username badge - visible only on mobile when logged in -->
      <div class="d-lg-none d-flex align-items-center order-lg-3" *ngIf="isAuthenticated()">
        <span class="username-badge">
          <i class="bi bi-person-circle"></i>
          {{ user()?.preferred_username || user()?.username || "User" }}
        </span>
      </div>

      <!-- Toggler for mobile -->
      <button
        class="navbar-toggler order-lg-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarCollapse"
        aria-controls="navbarCollapse"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Menu -->
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link active" href="#" aria-current="page">
              <i class="bi bi-house-door me-1"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              <i class="bi bi-file-text me-1"></i>Mock Tests
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              <i class="bi bi-trophy me-1"></i>Leaderboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              <i class="bi bi-book me-1"></i>Resources
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">
              <i class="bi bi-info-circle me-1"></i>About
            </a>
          </li>
        </ul>

        <!-- Right Side: Auth Buttons -->
        <div class="auth-section">
          <!-- Show when NOT authenticated -->
          <ng-container *ngIf="!isAuthenticated()">
            <button (click)="login()" class="btn btn-signin">
              <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
            </button>
            <a [href]="registerUrl" class="btn btn-register">
              <i class="bi bi-person-plus me-1"></i>Register
            </a>
          </ng-container>

          <!-- Show when authenticated -->
          <ng-container *ngIf="isAuthenticated()">
            <!-- Profile Dropdown -->
            <div class="dropdown">
              <button
                class="btn btn-profile dropdown-toggle"
                type="button"
                id="profileDropdown"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <i class="bi bi-person-circle me-2"></i>
                <span class="d-none d-lg-inline">
                  {{ user()?.preferred_username || user()?.username || "Profile" }}
                </span>
                <span class="d-lg-none">Profile</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="profileDropdown">
                <li>
                  <div class="dropdown-header">
                    <strong>{{ user()?.preferred_username || user()?.username }}</strong>
                    <small class="d-block text-muted">{{ user()?.email || "" }}</small>
                  </div>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
               
                </li>
                <li>
                <li><hr class="dropdown-divider"></li>
                <li>
                  <button class="dropdown-item text-danger" (click)="logout()">
                    <i class="bi bi-box-arrow-right me-2"></i>Sign Out
                  </button>
                </li>
              </ul>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </nav>

  <!-- Add this at the end of the navbar, right before closing header tag -->
<div class="notification-container" *ngIf="showNotification">
  <div class="notification alert" [ngClass]="notificationClass" role="alert">
    <div class="d-flex align-items-center">
      <i [class]="notificationIcon"></i>
      <span class="ms-2">{{ notificationMessage }}</span>
    </div>
    <button type="button" class="btn-close" (click)="dismissNotification()" aria-label="Close"></button>
  </div>
</div>
</header>
