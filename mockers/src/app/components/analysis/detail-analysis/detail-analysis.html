<!-- Spinner -->
<div *ngIf="loading" class="d-flex justify-content-center align-items-center" style="height: 100vh;">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<!-- Main Content -->
<div *ngIf="!loading" class="container-fluid p-3">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm p-2 mb-3">
    <div class="container-fluid">
      <!-- <a class="navbar-brand fw-bold text-primary" href="#">
        <i class="bi bi-journal-text me-2"></i> Test Portal {{ attemptId }}
      </a> -->

      <!-- Timer -->
      <div class="order-lg-2 mx-auto">
        <div class="timer-box px-3 py-1 bg-light rounded-pill border small fw-semibold text-dark">
          <!-- Timer content here -->
        </div>
      </div>

      <!-- Toggler -->
      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarContent"
        aria-controls="navbarContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Right side -->
      <div class="collapse navbar-collapse order-lg-3" id="navbarContent">
        <div class="d-flex align-items-center ms-lg-auto flex-column flex-lg-row gap-3 mt-3 mt-lg-0">
          <a class="nav-link text-dark fw-semibold" href="#">
            <!-- <i class="bi bi-person"></i> {{ username || "Guest" }} -->
          </a>
          <!-- <a class="nav-link text-dark fw-semibold" href="#">
            <i class="bi bi-gear"></i> Settings
          </a> -->
        </div>
      </div>
    </div>
  </nav>

  <!-- Section Tabs -->
  <app-analysis-section-tabs
    (currentSection)="handleCurrentSection($event)"
    [currentQuestionNo]="currentQuestionNo"
  ></app-analysis-section-tabs>

  <!-- Main Content -->
  <div class="row">
    <!-- Left Column: Questions -->
    <div class="col-12 col-lg-8 mb-3">
      <div class="card-custom">
        <app-analysis-questions
          [questionMap]="questionMap"
          [snapshotMap]="snapshotMap"
          [currentQuestion]="currentQuestion"
          [currentQuestionModel]="currentQuestionModel"
          [currentQuestionIndex]="currentQuestionNo || 0"
          (saveStatusAndNext)="handleNextQuestion($event)"
          (saveStatusAndPrev)="handlePreviousQuestion($event)"
        >
        </app-analysis-questions>
      </div>
    </div>

    <!-- Right Column: Legends & Navigator -->
    <div class="col-12 col-lg-4 mb-3">
      <div class="card-custom">
        <!-- <app-analysis-legends></app-analysis-legends> -->
        <app-analysis-navigator
          (navigateQuestion)="handleNavigateQuestion($event)"
          [currentSection]="currentSection"
          [snapshotMap]="snapshotMap"
          [questionMap]="questionMap"
        ></app-analysis-navigator>
      </div>
    </div>
  </div>

  <!-- Optional Snapshot JSON for debugging -->
  <!--
  <div class="card-custom mt-3">
    <h2>Attempt Snapshot</h2>
    <pre>{{ snapshotObject | json }}</pre>
  </div>
  -->
</div>
