<div *ngIf="currentQuestion">
  <!-- Question Header -->
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5>Question No. {{ currentQuestion.id }}</h5>

    <!-- Badge for question status -->
    <span *ngIf="!currentQuestionModel" class="badge bg-secondary fs-6">
      Not Visited
    </span>
    <span
      *ngIf="currentQuestionModel && currentQuestionModel.selectedOption === -1"
      class="badge bg-warning fs-6"
    >
      Not Answered
    </span>
  </div>

  <!-- Question Text -->
  <p class="fw-semibold">{{ currentQuestion.question.text }}</p>

  <!-- Question Image -->
  <div
    *ngIf="
      currentQuestion.question.image &&
      currentQuestion.question.image !== 'NA' &&
      currentQuestion.question.image !== 'null' &&
      currentQuestion.question.image !== '-'
    "
    class="mb-2"
    style="width: 100%; background-color: white; display: inline-block"
  >
    <img
      [src]="currentQuestion.question.image"
      alt="Question Image"
      class="img-fluid rounded"
      style="max-height: 250px; object-fit: contain; display: block"
    />
  </div>

  <!-- Options List -->
  <div class="list-group">
    <label
      *ngFor="let option of currentQuestion.options; let i = index"
      class="list-group-item d-flex flex-column align-items-start"
      [ngClass]="getOptionClass(i + 1)"
    >
      <div class="d-flex align-items-center w-100">
        <input
          type="radio"
          name="option"
          class="form-check-input me-2"
          [value]="i"
          [checked]="currentQuestionModel?.selectedOption === i + 1"
          disabled
        />
        <span>{{ option.text }}</span>
      </div>

      <!-- Option Image -->
      <div *ngIf="option.image && option.image !== 'NA'" class="mt-1 w-100">
        <img
          [src]="option.image"
          alt="Option Image"
          class="img-fluid rounded"
          style="max-height: 150px; object-fit: contain"
        />
      </div>
    </label>
  </div>

  <!-- Navigation Buttons -->
  <div class="d-flex justify-content-between mt-4 p-3 bg-light rounded-3 shadow-sm action-buttons">
    <!-- Previous Button -->
    <button class="btn btn-outline-primary d-flex align-items-center" (click)="previous()">
      <i class="bi bi-arrow-left me-2"></i>
      <span>Previous</span>
    </button>

    <!-- Next Button -->
    <button class="btn btn-success d-flex align-items-center" (click)="Next()">
      <span>Next</span>
      <i class="bi bi-arrow-right ms-2"></i>
    </button>
  </div>
</div>
